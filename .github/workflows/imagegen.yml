name: Generate backgrounds (free, self-hosted model)
on:
  push:
    paths: ["jobs/**"]
  workflow_dispatch:
    inputs:
      model: { description: "Hugging Face model id", required: false, default: "stabilityai/sdxl-turbo" }
      steps: { description: "Inference steps", required: false, default: "4" }
      only: { description: "Only this job file (stem), optional", required: false, default: "" }
permissions: { contents: write }
concurrency: { group: imagegen, cancel-in-progress: false }
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      IMAGE_MODEL: ${{ inputs.model || 'stabilityai/sdxl-turbo' }}
      IMAGE_STEPS: ${{ inputs.steps || '4' }}
      ONLY_JOB: ${{ inputs.only || '' }}
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ env.IMAGE_MODEL }}-v1
      - name: Install (CPU only)
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet diffusers transformers accelerate safetensors pillow numpy
      - name: Generate
        run: python3 gen/imagegen.py
      - name: Commit images
        run: |
          git config user.name "imagegen"
          git config user.email "imagegen@users.noreply.github.com"
          git add bg || true
          git diff --cached --quiet || (git commit -m "Backgrounds generated ($IMAGE_MODEL)" && (git push || (git pull --rebase && git push)))
